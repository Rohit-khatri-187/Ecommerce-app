spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:h2:mem:ecommerce
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
  h2:
    console:
      path: /h2-console
      enabled: true

server:
  port: 8090
  servlet:
    context-path: /api/v1


jwt:
  secret: ${JWT_SECRET:V7r9!xP2s#LqZ8@MjUe6^TfCwY4bHnKd}
  expiration: ${JWT_EXPIRATION_TIME:604800000}


