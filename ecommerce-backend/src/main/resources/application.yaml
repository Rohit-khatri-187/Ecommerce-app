spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:h2:mem:ecommerce
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
  h2:
    console:
      path: /h2-console
      enabled: true

server:
  port: 8090
